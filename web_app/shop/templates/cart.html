{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>Teluxe - Luxury Watch Collection | Premium Timepieces</title>
    <meta content="Discover the finest luxury timepieces from Rolex, Omega, Patek Philippe & more. Premium watches with authenticated quality and exclusive designs." name="description">
    <meta content="luxury watches, premium timepieces, Rolex, Omega, Patek Philippe, Audemars Piguet, luxury accessories" name="keywords">
    <meta content="Teluxe" name="author">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta content="Teluxe - Luxury Watch Collection" property="og:title">
    <meta content="Discover the finest luxury timepieces from the world's most prestigious brands" property="og:description">
    <meta content="website" property="og:type">
    <meta content="https://lovable.dev/opengraph-image-p98pqg.png" property="og:image">
    <meta content="summary_large_image" name="twitter:card">
    <meta content="@lovable_dev" name="twitter:site">
    <meta content="https://lovable.dev/opengraph-image-p98pqg.png" name="twitter:image">
  <script type="text/javascript" src="{% static 'script.js' %}?v=202501161200"></script>
  <script type="text/javascript" src="{% static 'cart.js' %}?v=202501161200"></script>

  <link href="{% static 'index.css' %}?v=202501161200" rel="stylesheet">
  <link href="{% static 'sonner-toaster.css' %}" rel="stylesheet">
  </head>
  <body>
    {% csrf_token %}
    <div id="root">
      <div aria-label="Notifications (F8)" role="region" style="pointer-events:none" tabindex="-1">
        <ol class="fixed top-0 z-[100] flex max-h-screen w-full flex-col-reverse p-4 sm:bottom-0 sm:right-0 sm:top-auto sm:flex-col md:max-w-[420px]" tabindex="-1"></ol>
      </div>
      <section aria-atomic="false" aria-label="Notifications alt+T" aria-live="polite" aria-relevant="additions text" tabindex="-1"></section>
      <div class="min-h-screen bg-background font-luxury">
        <main class="pb-16">
          <div class="p-4">
            <h1 class="text-3xl font-bold text-luxury-black mb-8">Shopping Cart</h1>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
              <!-- Cart Items -->
              <div class="lg:col-span-2">
                <div class="cart-items-container">
                  <!-- Cart items will be rendered here by JavaScript -->
                  <div class="text-center py-8">
                    <div class="animate-pulse">
                      <div class="text-luxury-gray-dark">Loading cart...</div>
                    </div>
                  </div>
                </div>
              </div>
              
              <!-- Cart Summary -->
              <div class="lg:col-span-1">
                <div class="cart-summary" style="display: none;">
                  <!-- Summary will be rendered here by JavaScript -->
                </div>
              </div>
            </div>
          </div>
            </div>
          </div>
        </main>
        {% with active_page='cart' %}
          {% include 'navbar.html' %}
        {% endwith %}
      </div>
    </div>
    
    <script>
      // Initialize the cart system when page loads
      document.addEventListener('DOMContentLoaded', async function() {
        console.log('🚀 Cart page loading...');
        try {
          window.cartManager = ServerCartManager || {};
        } catch(e) {
          console.log('CartManager not loaded, creating basic one');
          window.cartManager = {
            updateQuantity: async function(itemId, qty) {
              const response = await fetch('/api/update-cart-item/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
                body: JSON.stringify({item_id: itemId, quantity: qty})
              });
              return response.json();
            },
            removeFromCart: async function(itemId) {
              const response = await fetch('/api/remove-from-cart/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
                body: JSON.stringify({item_id: itemId})
              });
              return response.json();
            },
            clearCart: async function() {
              const response = await fetch('/api/clear-cart/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')}
              });
              return response.json();
            }
          };
        }
        await loadCartPage();
      });

      async function loadCartPage() {
        console.log('📦 Loading cart data...');
        try {
          // Load cart data directly
          const response = await fetch('/api/get-cart/', {
            method: 'GET',
            headers: {
              'Content-Type': 'application/json',
            },
            credentials: 'same-origin'
          });
          
          console.log('📡 Response status:', response.status);
          
          if (response.ok) {
            const data = await response.json();
            console.log('✅ Cart data received:', data);
            if (data.success) {
              renderCartItems(data.cart.items);
              renderCartSummary(data.cart);
            } else {
              console.error('❌ API returned error:', data.error);
              showError('Failed to load cart');
            }
          } else {
            console.error('❌ Response not OK:', response.status);
            showError('Failed to load cart');
          }
        } catch (error) {
          console.error('❌ Error loading cart:', error);
          showError('Error loading cart: ' + error.message);
        }
      }
      
      function showError(message) {
        const container = document.querySelector('.cart-items-container');
        container.innerHTML = `
          <div class="text-center py-8">
            <div class="text-red-500 mb-2">${message}</div>
            <button onclick="location.reload()" class="bg-luxury-gold hover:bg-luxury-gold-dark text-luxury-black px-4 py-2 rounded">
              Retry
            </button>
          </div>
        `;
      }

      function renderCartItems(items) {
        const container = document.querySelector('.cart-items-container');
        
        console.log('🛒 renderCartItems called with items:', items);
        
        if (!items || items.length === 0) {
          container.innerHTML = `
            <div class="flex flex-col items-center justify-center py-12 px-4">
              <div class="text-center max-w-sm">
                <svg class="lucide lucide-shopping-bag mx-auto text-luxury-gray mb-4" fill="none" height="64" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="64" xmlns="http://www.w3.org/2000/svg">
                  <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
                  <path d="M3 6h18"></path>
                  <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
                <h2 class="text-xl font-bold text-luxury-black mb-2">Your Cart is Empty</h2>
                <p class="text-luxury-gray-dark mb-6">
                  Discover our luxury timepieces and find your perfect watch.
                </p>
                
                <div class="space-y-3">
                  <a href="{% url 'shop:catalog' %}" 
                     class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0 h-10 px-4 py-2 bg-luxury-gold hover:bg-luxury-gold-dark text-luxury-black font-semibold">
                    Browse Collection
                  </a>
                  
                  <div>
                    <a href="{% url 'shop:index' %}" 
                       class="inline-flex items-center px-4 py-2 text-luxury-gray-dark hover:text-luxury-gold transition-colors duration-200 text-sm">
                      Back to Home
                    </a>
                  </div>
                </div>
              </div>
            </div>
          `;
          document.querySelector('.cart-summary').style.display = 'none';
          return;
        }

        const itemsHtml = items.map(item => {
          // Format diamond specifications nicely
          console.log('🔍 Processing item:', item);
          console.log('🔍 Customization data:', item.customization_data);
          
          let customizationHtml = '';
          if (item.customization_data) {
            const customData = typeof item.customization_data === 'string' ? 
              JSON.parse(item.customization_data) : item.customization_data;
            
            console.log('🔍 Parsed customData:', customData);
            
            if (customData.diamond_type && customData.diamond_quantities) {
              const diamondType = customData.diamond_type === 'natural' ? 'Natural' : 'Lab';
              
              const sizeLabels = {
                'under_5': 'Under 5mm',
                '5_to_7': '5-7mm', 
                '8_to_12': '8-12mm',
                '13_to_17': '13-17mm'
              };
              
              // Build quantities string
              let quantitiesStr = '';
              for (const [size, qty] of Object.entries(customData.diamond_quantities)) {
                if (qty > 0) {
                  quantitiesStr += `${sizeLabels[size]}: ${qty}, `;
                }
              }
              quantitiesStr = quantitiesStr.slice(0, -2); // Remove last comma
              
              // Build all specifications in compact format
              let specs = `${diamondType}`;
              
              // Add quantities inline
              for (const [size, qty] of Object.entries(customData.diamond_quantities)) {
                if (qty > 0) {
                  const shortSize = size === 'under_5' ? 'Under 5mm' : 
                                   size === '5_to_7' ? '5-7mm' : 
                                   size === '8_to_12' ? '8-12mm' : '13-17mm';
                  specs += `  •  ${shortSize}: ${qty}`;
                }
              }
              
              if (customData.gold_price) {
                specs += `<br>Gold: $${parseFloat(customData.gold_price).toFixed(0)}`;
              }
              if (customData.diamond_price) {
                specs += `  •  Diamonds: $${parseFloat(customData.diamond_price).toFixed(0)}`;
              }
              if (customData.work_price) {
                specs += `  •  Work: $${parseFloat(customData.work_price).toFixed(0)}`;
              }
              
              customizationHtml = `
                <div class="mt-2 px-3 py-2 rounded text-xs" style="background-color: #fafafa; border-left: 2px solid #d4af37; line-height: 1.5; color: #6b7280;">
                  ${specs}
                </div>
              `;
            } else {
              // Fallback for other customization types
              const entries = Object.entries(customData)
                .filter(([key, value]) => !['gold_price', 'diamond_price', 'work_price'].includes(key))
                .map(([key, value]) => `<div><strong>${key}:</strong> ${value}</div>`)
                .join('');
              if (entries) {
                customizationHtml = `<div class="mt-2 p-3 bg-gray-100 rounded-lg text-xs" style="background-color: #f3f4f6;">${entries}</div>`;
              }
            }
          }

          return `
            <div class="cart-item bg-luxury-white rounded-lg shadow-sm p-3 mb-3" data-item-id="${item.id}" style="background-color: #ffffff;">
              <div class="flex items-start space-x-4">
                <div class="flex-shrink-0">
                  <img src="${item.product.image_url || '{% static "hero-watch-D40AmJ87.jpg" %}'}" 
                       alt="${item.product.name}" 
                       class="w-16 h-16 object-cover rounded">
                </div>
                <div class="flex-1 min-w-0">
                  <h3 class="font-semibold text-luxury-black text-sm leading-tight">${item.product.name}</h3>
                  <p class="text-xs text-luxury-gray-dark mt-1">${item.product.brand}</p>
                  <div class="text-base font-bold text-luxury-gold mt-2">$${item.price}</div>
                </div>
                <div class="flex items-center space-x-1 flex-shrink-0">
                  <button onclick="updateItemQuantity(${item.id}, ${item.quantity - 1})" 
                          class="w-7 h-7 rounded text-luxury-black font-semibold text-sm" 
                          style="background-color: #f3f4f6;">-</button>
                  <span class="w-8 text-center font-medium text-sm">${item.quantity}</span>
                  <button onclick="updateItemQuantity(${item.id}, ${item.quantity + 1})" 
                          class="w-7 h-7 rounded text-luxury-black font-semibold text-sm" 
                          style="background-color: #f3f4f6;">+</button>
                  <button onclick="removeItem(${item.id})" 
                          class="ml-1 text-red-500 hover:text-red-700 font-bold text-lg w-7 h-7 flex items-center justify-center">×</button>
                </div>
              </div>
              ${customizationHtml}
            </div>
          `;
        }).join('');

        container.innerHTML = itemsHtml;
        document.querySelector('.cart-summary').style.display = 'block';
      }

      function renderCartSummary(cartData) {
        const summaryContainer = document.querySelector('.cart-summary');
        const orderConfirmationUrl = "{% url 'shop:order_confirmation' %}";
        
        summaryContainer.innerHTML = `
          <div class="bg-luxury-white p-6 rounded-lg shadow-sm">
            <h2 class="text-xl font-bold text-luxury-black mb-4">Order Summary</h2>
            <div class="space-y-2 mb-4">
              <div class="flex justify-between">
                <span>Items (${cartData.total_items}):</span>
                <span>$${cartData.total_price}</span>
              </div>
              <div class="flex justify-between font-bold text-lg border-t pt-2">
                <span>Total:</span>
                <span class="text-luxury-gold">$${cartData.total_price}</span>
              </div>
            </div>
            <button onclick="clearCart()" 
                    class="w-full mb-2 bg-luxury-gray-light hover:bg-luxury-gray text-luxury-black font-semibold py-2 px-4 rounded">
              Clear Cart
            </button>
            <button onclick="placeOrder()" 
                    class="w-full bg-luxury-gold hover:bg-luxury-gold-dark text-luxury-black font-semibold py-2 px-4 rounded">
              Place Order
            </button>
          </div>
        `;
      }

      async function updateItemQuantity(itemId, newQuantity) {
        if (newQuantity <= 0) {
          removeItem(itemId);
          return;
        }

        try {
          await window.cartManager.updateQuantity(itemId, newQuantity);
          loadCartPage(); // Reload to show updated data
        } catch (error) {
          console.error('Error updating quantity:', error);
          showToast('Error updating quantity', 'error');
        }
      }

      async function removeItem(itemId) {
        try {
          await window.cartManager.removeFromCart(itemId);
          loadCartPage(); // Reload to show updated data
        } catch (error) {
          console.error('Error removing item:', error);
          showToast('Error removing item', 'error');
        }
      }

      async function clearCart() {
        if (confirm('Are you sure you want to clear your cart?')) {
          try {
            await window.cartManager.clearCart();
            loadCartPage(); // Reload to show empty cart
          } catch (error) {
            console.error('Error clearing cart:', error);
            showToast('Error clearing cart', 'error');
          }
        }
      }

      async function placeOrder() {
        try {
          // Redirect to shipping page where user can select shipping address and enter email
          window.location.href = "{% url 'shop:shipping' %}";
        } catch (error) {
          console.error('Error redirecting to shipping:', error);
          showToast('Error proceeding to shipping', 'error');
        }
      }
      
            
      // Helper function to get cookie value
      function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
          const cookies = document.cookie.split(';');
          for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
              cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
              break;
            }
          }
        }
        return cookieValue;
      }
      
      // Toast notification function
      function showToast(message, type = 'info') {
        console.log(`Toast: ${message} (${type})`);
        alert(message); // Simple fallback, can be improved with a proper toast library
      }
    </script>
  </body>
</html>
